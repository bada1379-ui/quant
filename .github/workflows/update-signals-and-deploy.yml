name: ETF Quant LIVE v2 - Weekly Signals & Pages

on:
  workflow_dispatch:

  schedule:
    # 한국시간 금요일 18:17 - 장 마감 후 1차 신호 계산
    - cron: '17 18 * * 5'
      timezone: 'Asia/Seoul'

    # 한국시간 토요일 10:17 - 데이터 지연 대비 재계산
    - cron: '17 10 * * 6'
      timezone: 'Asia/Seoul'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etf-quant-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate latest ETF signals
        run: python signal_engine.py

      - name: Save signal results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_signals.json 2>/dev/null || true
          git add data/history 2>/dev/null || true
          git add data/last_engine_errors.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update weekly ETF signals"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
